version: '3'

info:
  companyName: "Link Alloy"
  productName: "Link Alloy"
  productIdentifier: "app.linkalloy.desktop"
  description: "Independent Windows multi-link networking client"
  copyright: "Copyright 2026 Sayan Pramanik"
  comments: "Windows system tunnel for connection-level multi-link routing"
  version: "0.0.2"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
