version: '3'

tasks:
  go:mod:tidy:
    summary: Runs go mod tidy
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Installs the pinned frontend dependencies with pnpm
    run: once
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules
    preconditions:
      - sh: pnpm --version
        msg: pnpm is required to build the Windows desktop interface.
    cmds:
      - pnpm install --frozen-lockfile --force

  build:frontend:
    summary: Builds the React and TypeScript interface
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
    cmds:
      - pnpm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}}
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  generate:bindings:
    summary: Generates the Wails TypeScript bindings
    internal: true
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true{{if eq .OBFUSCATED "true"}} -obfuscated{{end}} -ts -i

  generate:icons:
    summary: Generates the Windows application icon
    internal: true
    run: once
    dir: build
    sources:
      - appicon.png
    generates:
      - windows/icon.ico
    cmds:
      - wails3 generate icons -input appicon.png -windowsfilename windows/icon.ico

  dev:frontend:
    summary: Runs the React development server
    deps:
      - task: install:frontend:deps
    cmds:
      - pnpm --dir frontend dev --port {{.VITE_PORT}} --strictPort
