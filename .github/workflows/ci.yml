name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26

      - name: Install pinned pnpm
        shell: pwsh
        run: |
          npm install --global --prefix "$env:RUNNER_TEMP\linkalloy-pnpm" pnpm@10.34.9 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\linkalloy-pnpm" -Encoding utf8

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate Wails bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Test dashboard state and polling
        run: pnpm --dir frontend test

      - name: Audit frontend dependencies
        run: pnpm --dir frontend audit --audit-level=low

      - name: Verify signed Wintun runtimes
        shell: pwsh
        run: ./tools/verify-wintun.ps1

      - name: Compile Go packages
        run: go test -mod=mod -count=1 ./...

      - name: Analyze Go code
        run: go vet -mod=mod ./...

      - name: Check reachable Go vulnerabilities
        run: go run -mod=mod golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Fuzz packet parsing without changing routes
        run: go test -mod=mod ./internal/engine -run '^$' -fuzz '^FuzzFlowTablePacketParsing$' -fuzztime=10s -parallel=2

      - name: Fuzz TLS service inspection without changing routes
        run: go test -mod=mod ./internal/engine -run '^$' -fuzz '^FuzzTLSServiceInspection$' -fuzztime=10s -parallel=2

      - name: Build Windows preview
        shell: pwsh
        run: |
          wails3 task windows:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

